<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>make.fun CORS + POST test</title></head>
<body>
<h1>make.fun CORS + POST test</h1>
<pre id="result">running…</pre>
<script>
(async () => {
  const out = [];
  const log = (s) => { out.push(s); document.getElementById('result').textContent = out.join('\n'); };
  // Test 1: simple GET
  try {
    const r = await fetch('https://make.fun/api/auth/methods');
    const j = await r.json();
    log('TEST1 GET /api/auth/methods: OK HTTP ' + r.status + ' readable=yes');
    log('  chain_id=' + (j.solana && j.solana.chain_id));
  } catch (e) {
    log('TEST1 GET /api/auth/methods: FAILED ' + e.name + ' ' + e.message);
  }
  // Test 2: JSON POST (nonce)
  try {
    const r = await fetch('https://make.fun/api/auth/siws/nonce', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ walletAddress: '51589xP5R4D7xgZP85z7FQ4d8Te8hq2QEm8WFVecopue' })
    });
    const j = await r.json();
    log('TEST2 POST /api/auth/siws/nonce: OK HTTP ' + r.status + ' readable=yes');
    log('  nonce=' + j.nonce);
    log('  issuedAt=' + j.issuedAt);
    log('  expirationTime=' + j.expirationTime);
    log('  domain=' + j.domain + ' uri=' + j.uri);
  } catch (e) {
    log('TEST2 POST /api/auth/siws/nonce: FAILED ' + e.name + ' ' + e.message);
  }
  log('DONE');
})();
</script>
</body>
</html>
